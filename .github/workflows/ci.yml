name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  checks:
    name: TypeScript + Lint + Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node — match whatever version you use locally
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      #    Uses cache automatically via the 'cache: npm' above
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript check
      #    Catches type errors without actually building the app
      - name: TypeScript check
        run: npx tsc --noEmit

      # 5. ESLint
      - name: Lint
        run: npm run lint

      # 6. Jest tests
      #    --ci flag: fails if snapshots are missing instead of writing them
      #    --coverage: generates coverage report
      #    --forceExit: prevents Jest from hanging (common in RN)
      - name: Run tests
        run: npm run test -- --ci --coverage --forceExit --passWithNoTests

      # 7. Upload coverage report as artifact (optional but useful)
      #    You can view this in the GitHub Actions tab after each run
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
